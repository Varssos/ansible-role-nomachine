---
- name: Check if NoMachine is already installed
  ansible.builtin.command: dpkg-query -W nomachine
  register: nomachine_installed
  failed_when: false
  changed_when: false

- name: Download NoMachine .deb package
  ansible.builtin.get_url:
    url: "{{ nomachine_deb_url }}"
    dest: "/tmp/{{ nomachine_deb_file }}"
    mode: '0644'
  when: nomachine_installed.rc != 0

- name: Install NoMachine
  ansible.builtin.apt:
    deb: "/tmp/{{ nomachine_deb_file }}"
    state: present
  become: true
  when: nomachine_installed.rc != 0

- name: Remove temporary .deb package
  ansible.builtin.file:
    path: "/tmp/{{ nomachine_deb_file }}"
    state: absent
  when: nomachine_installed.rc != 0

- name: Ensure NoMachine service is enabled and running
  ansible.builtin.service:
    name: "{{ nomachine_service_name }}"
    state: started
    enabled: true
  become: true